<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - EcomWeb</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>

  <div class="container">
    <div class="breadcrumbs">
      <a href="index.html">Home</a> <span>&#8250;</span>
      <a href="products.html">Products</a> <span>&#8250;</span>
      <span id="breadcrumb-name">Product</span>
    </div>
  </div>

  <section class="product-detail">
    <div class="container">
      <div class="product-detail-grid" id="product-detail"></div>
    </div>
  </section>

  <!-- Related Products -->
  <section class="products-section">
    <div class="container">
      <div class="section-title">
        <h2>You May Also Like</h2>
        <p>Similar products you might enjoy</p>
      </div>
      <div class="products-grid" id="related-products"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('header').innerHTML = getHeader();
    document.getElementById('footer').innerHTML = getFooter();

    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id'));
    const product = products.find(p => p.id === productId);

    if (product) {
      document.title = `${product.name} - EcomWeb`;
      document.getElementById('breadcrumb-name').textContent = product.name;

      const originalPrice = product.originalPrice
        ? `<span class="original-price" style="font-size:1.2rem;">$${product.originalPrice.toFixed(2)}</span>`
        : '';

      const discount = product.originalPrice
        ? `<span style="background:var(--success);color:#fff;padding:4px 12px;border-radius:20px;font-size:0.8rem;margin-left:12px;">
            Save ${Math.round((1 - product.price / product.originalPrice) * 100)}%
          </span>`
        : '';

      const featuresHtml = product.features
        ? product.features.map(f => `<li style="padding:4px 0;">&#10003; ${f}</li>`).join('')
        : '';

      document.getElementById('product-detail').innerHTML = `
        <div class="product-detail-image">
          <img src="${product.image}" alt="${product.name}">
        </div>
        <div class="product-detail-info">
          <h1>${product.name}</h1>
          <div class="rating" style="font-size:1rem;margin-bottom:16px;">
            ${renderStars(product.rating)} ${product.rating} (${product.reviews} reviews)
          </div>
          <div class="price">
            $${product.price.toFixed(2)} ${originalPrice} ${discount}
          </div>
          <p class="description">${product.description}</p>
          ${featuresHtml ? `<ul style="margin-bottom:24px;padding-left:0;list-style:none;color:var(--dark-light);">${featuresHtml}</ul>` : ''}
          <div class="quantity-selector">
            <label>Quantity:</label>
            <div class="qty-controls">
              <button onclick="changeQty(-1)">-</button>
              <input type="number" id="qty" value="1" min="1" max="10" readonly>
              <button onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-primary" onclick="addToCartDetail()">Add to Cart</button>
            <a href="products.html" class="btn btn-secondary">Continue Shopping</a>
          </div>
        </div>`;

      // Related products (same category, exclude current)
      const related = products
        .filter(p => p.category === product.category && p.id !== product.id)
        .slice(0, 4);
      document.getElementById('related-products').innerHTML =
        related.map(p => createProductCard(p)).join('');
    } else {
      document.getElementById('product-detail').innerHTML = `
        <div style="text-align:center;grid-column:1/-1;padding:80px 20px;">
          <div style="font-size:4rem;">&#128533;</div>
          <h2>Product not found</h2>
          <p style="color:var(--gray);margin-bottom:24px;">The product you're looking for doesn't exist.</p>
          <a href="products.html" class="btn btn-primary">Browse Products</a>
        </div>`;
    }

    function changeQty(delta) {
      const input = document.getElementById('qty');
      const val = parseInt(input.value) + delta;
      if (val >= 1 && val <= 10) input.value = val;
    }

    function addToCartDetail() {
      const qty = parseInt(document.getElementById('qty').value);
      cart.addItem(product, qty);
    }
  </script>
</body>
</html>
